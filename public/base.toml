# Consumables: goods the player-like AI uses from its item slots, on top of the template's flask.
# It can use any goods with an AI usage (EquipParamGoods.aiUseJudgeId): pots, knives, darts and
# stones it throws, meats and livers it eats, greases it rubs on its weapon, aromatics. Each Tarnished
# draws `kinds` different ones within its level (`level` = earliest level, `weight` = relative
# chance, `count` = how many it carries). An entry's own `consumables` list replaces this pool;
# [] carries none. Shadow of the Erdtree goods (ids from 2000000) are left out without the DLC.
[consumables]
kinds = 3
