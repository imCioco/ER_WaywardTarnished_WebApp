# Consumables: goods the player-like AI uses from its item slots, on top of the template's flask.
# It can use any goods with an AI usage (EquipParamGoods.aiUseJudgeId): pots, knives, darts and
# stones it throws, meats and livers it eats, greases it rubs on its weapon, aromatics. Each Tarnished
# draws `kinds` different ones within its level (`level` = earliest level, `weight` = relative
# chance, `count` = how many it carries). An entry's own `consumables` list replaces this pool;
# [] carries none.
[consumables]
kinds = 2
pool = [
    { id = 300, count = 3 },                # Fire Pot
    { id = 1700, count = 8 },               # Throwing Dagger
    { id = 820, count = 2, level = 10 },    # Boiled Crab
    { id = 1720, count = 6, level = 15 },   # Poisonbone Dart
    { id = 1400, count = 2, level = 15 },   # Fire Grease
    { id = 320, count = 3, level = 20 },    # Lightning Pot
    { id = 1730, count = 5, level = 25 },   # Kukri
    { id = 1410, count = 2, level = 25 },   # Lightning Grease
    { id = 360, count = 3, level = 30 },    # Freezing Pot
    { id = 1830, count = 3, level = 30 },   # Explosive Stone
    { id = 1210, count = 2, level = 35 },   # Exalted Flesh
    { id = 302, count = 2, level = 60 },    # Giantsflame Fire Pot
    { id = 321, count = 2, level = 80 },    # Ancient Dragonbolt Pot
]

