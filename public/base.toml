# Wayward Tarnished base library. See docs/LIBRARY.md for the format.

# One template per role. name_rows: NpcParam rows lent to one Tarnished each so every name tag
# shows its own name. Teams (the game's own relation table): 27 NPC invaders fight you and 47 but
# ignore 2 and 16; 47 (spirit summons) fights 27 beside you; 2 (white phantoms) fights the
# invader team 16 you join while invading, and the world's enemies fight 2 but not 16.
# [chances] (optional): percent of the picks for whole groups, shared inside by weight. Entries with their
# own chance keep it. Groups: named (one fixed name), loadouts, class_libraries. Example:
# [chances]
# class_libraries = 20

[templates.invader]
npc_param = 523770000
think_param = 523770000
chara_init = 23770
name_rows = [523770000, 523700000, 523710000, 523610000, 523670000, 523870000, 523880000, 523900000, 523460000, 523450000]
custom_weapons = [1000, 1001, 1002, 1003, 1004, 1005]
items = [[50201, 2]]

