# AI styles: SpEffects that the game's player-like AI (battle goal 29999) reads to add a
# personality row of NpcAiBehaviorProbability to its situational odds. Each is the one a vanilla
# NPC carries; an entry's styles list is drawn from per spawn.
[styles]
reckless = 18659     # Anastasia: heavy attacks, dash, rolling and jump attacks
agile = 18660        # Okina: dash, rolling and backstep attacks
brawler = 18662      # Vargram: dash and rolling attacks, circles the target
relentless = 18664   # Eleonora: dash and backstep attacks, some casting
steady = 18657       # Tragoth: more plain light and heavy attacks
duelist = 20018674   # Hornsent: guards and counters, backsteps, no forward or side rolls
kiting = 18667       # Sellen: casts while circling, never dashes in
battlemage = 18663   # Wilhelm: casts while advancing and circling, never dashes in
preceptor = 18693    # Miriam: casts while backing away
cautious = 5022      # Therolina, Dolores: backsteps, rolls back and retreats
evasive = 18658      # Juno Hoslow: dodges with rolling skills, stands firm when hit
zealot = 18656       # Vyke: buffs heavily, dash attacks, answers hits with attacks
unyielding = 20018672 # Leda: never rolls, guard counters, skills at every range
redmane = 20018673   # Freyja: guards projectiles, punishes guard breaks, skills; no spells, no rolls
knight = 20018675    # Ansbach: guard counters, stands firm, sometimes two-hands

