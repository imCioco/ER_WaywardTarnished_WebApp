# Gestures, by the names in docs/LIBRARY.md. A Tarnished may greet you with one of the greetings
# the first time it comes near after arriving (greeting_chance in the INI), and one that defeated you
# may play a victory gesture before it fades (victory_gesture_chance). An entry's own greetings or
# victories replace these lists; an empty list means never.
